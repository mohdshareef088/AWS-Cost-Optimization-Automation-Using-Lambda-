plugin: amazon.aws.aws_ec2 # to get the Ip addresses of all the machines
regions:
  - ap-south-1 # in which machines available
filters:
  tag:Environment: dev # tags used to create machines
  instance-state-name: running
compose:
  ansible_host: public_ip_address
keyed_groups:
  - key: tags.Name
    prefix: name
  - key: tags.Environment
    prefix: env
  - key: tags.os
    prefix: os
vars:
  ansible_ssh_private_key_file: /home/ubuntu/masterkey.pem   
